<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#080808"
    />

    <meta
      name="description"
      content="Hill City Media is a creative media and branding agency providing printing, digital marketing, videography, corporate identity, and visual communication solutions."
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://hillcitymedia.com/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon.png"
    />

    <!-- Page Title -->
    <title>Hill City Media &mdash; We Elevate Brands</title>

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Hill City Media &mdash; We Elevate Brands"
    />

    <meta
      property="og:description"
      content="Creative printing, digital marketing, videography, corporate identity, and media solutions designed to elevate ambitious brands."
    />

    <meta
      property="og:url"
      content="https://hillcitymedia.com/"
    />

    <meta
      property="og:site_name"
      content="Hill City Media"
    />

    <meta
      property="og:locale"
      content="en_NG"
    />

    <meta
      property="og:image"
      content="https://hillcitymedia.com/images/logo.png"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Hill City Media &mdash; We Elevate Brands"
    />

    <meta
      name="twitter:description"
      content="Creative printing, digital marketing, videography, corporate identity, and media solutions designed to elevate ambitious brands."
    />

    <meta
      name="twitter:image"
      content="https://hillcitymedia.com/images/logo.png"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
